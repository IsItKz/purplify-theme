name: 🐛 Bug Report
description: Report a glitch, crash, or UI bug in the theme
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: What happened?
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Operating System
      placeholder: e.g., Arch Linux
